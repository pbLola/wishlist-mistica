<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮Mystic Wishlist</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="cabecalho-principal">
        <h1>🔮 Mystic Wishlist</h1>
        <p>Salve seus desejos</p>
    </header>
    <main>
        <section>
            <form id="wishlist-form">
                <label for="input-nome">Nome</label>
                <input type="text" id="input-nome">
                <label for="input-preco">Preço</label>
                <input type="text" id="input-preco">
                <label for="input-link">Link</label>
                <input type="text" id="input-link">
                <button type="submit">Faça um desejo</button>
            </form>
        </section>
        <section id="cards-container">

        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
